[package]
name = "strands-tools"
version = "0.1.0"
edition = "2021"
description = "Ready-made tools for strands-rs agents — shell, file editing, HTTP, sleep, stop"
license = "Apache-2.0"
repository = "https://github.com/willpercey-gb/strands-rs"

[dependencies]
strands-core = { path = "../strands-core" }
tokio = { version = "1", features = ["process", "fs", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[features]
default = ["shell", "file-editor", "sleep", "stop"]
shell = []
file-editor = []
sleep = []
stop = []
http = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
